name: tests
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python datasetguard.py demo --output outputs/demo-report.json
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          cd outputs/sample && zip -r ../sample.zip train validation test
          cd ../..
          python app.py > /tmp/datasetguard-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8770/ >/dev/null && break; sleep 1; done
          npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-and-browser
          path: |
            outputs/demo-report.json
            outputs/browser.png
